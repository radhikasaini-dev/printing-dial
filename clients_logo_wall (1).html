
<style>
  :root{
    --color-background-secondary: #f8f9fa;
    --color-text-primary: #212529;
    --color-text-secondary: #495057;
    --color-text-tertiary: #868e96;
    --color-border-tertiary: #dee2e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding: 3rem 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 500; margin-bottom: 8px; }
  .title { font-size: 28px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; }
  .title em { font-style: normal; color: #185FA5; }
  .sub { font-size: 13px; color: var(--color-text-secondary); line-height: 1.7; max-width: 460px; margin-bottom: 2rem; }
  .logo-wall { display: flex; flex-wrap: wrap; gap: 0; border-top: 0.5px solid var(--color-border-tertiary); border-left: 0.5px solid var(--color-border-tertiary); }
  .logo-box { width: 25%; border-right: 0.5px solid var(--color-border-tertiary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: center; padding: 24px 20px; min-height: 90px; transition: background 0.15s; cursor: default; }
  .logo-box:hover { background: var(--color-background-secondary); }
  .logo-box svg { max-width: 110px; max-height: 44px; width: 100%; height: auto; }
  .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2rem; }
  .foot-text { font-size: 12px; color: var(--color-text-tertiary); }
  .btn { font-size: 13px; font-weight: 500; color: #185FA5; background: #E6F1FB; border: none; padding: 9px 22px; border-radius: 50px; cursor: pointer; }
</style>
